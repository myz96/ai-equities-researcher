<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terliatian Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2210%22 fill=%22%230B0C0E%22/><text x=%2232%22 y=%2243%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22%23E7E9EC%22 font-family=%22-apple-system,sans-serif%22 font-weight=%22600%22>TC</text></svg>" />
</head>
<body>
  <div id="birthday-banner" class="banner hidden">
    <span id="birthday-text"></span>
    <button id="banner-close" aria-label="Close">✕</button>
  </div>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="crest" aria-hidden="true"><span id="crest-mark">TC</span></span>
      <span id="site-name" class="wordmark">Terliatian Capital</span>
    </a>
    <form id="search-form" class="command" autocomplete="off">
      <span class="command-hint" aria-hidden="true">/</span>
      <input id="ticker-input" type="text" placeholder="Ticker — AAPL, NVDA, BHP.AX"
             spellcheck="false" required pattern="[A-Za-z0-9.\-^]{1,12}" aria-label="Ticker" />
      <button id="analyze-btn" type="submit">Convene</button>
    </form>
    <div class="topbar-right">
      <select id="model-select" aria-label="Committee brain"></select>
      <span id="cost-line" class="cost-line"></span>
    </div>
  </header>

  <div class="shell">
    <aside class="rail">
      <div class="rail-head">
        <span>Watchlist</span>
        <button id="watch-add" title="Add ticker" aria-label="Add ticker to watchlist">+</button>
      </div>
      <form id="watch-form" class="watch-form hidden">
        <input id="watch-input" type="text" placeholder="Add ticker" spellcheck="false"
               pattern="[A-Za-z0-9.\-]{1,12}" aria-label="Ticker to add" />
      </form>
      <nav id="watchlist" class="watchlist" aria-label="Watchlist"></nav>
      <div class="rail-head library-head"><span>Library</span></div>
      <nav id="library" class="library" aria-label="Research library"></nav>
    </aside>

    <main id="stage" class="stage" aria-live="polite"></main>
  </div>

  <footer>
    <p id="site-tagline-holder"><span id="site-tagline">The investment committee of legends</span> ·
      For education only. Nothing here is financial advice.
      The committee is artificial; the losses would be real.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
